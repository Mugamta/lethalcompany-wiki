site_name: 리썰 컴퍼니 메커니즘 위키
site_description: Lethal Company 게임 코드(Assembly-CSharp)를 직접 확인해 정리한 한국어 메커니즘 위키
# GitHub에 올린 뒤 실제 주소로 바꾸세요 (예: https://<계정>.github.io/lethalcompany-wiki/)
site_url: https://mugamta.github.io/lethalcompany-wiki/
repo_url: https://github.com/Mugamta/lethalcompany-wiki
repo_name: lethalcompany-wiki
edit_uri: edit/main/docs/
copyright: 팬 위키 · Lethal Company는 Zeekerss의 게임입니다. 이 사이트는 공식이 아닙니다.

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: 어두운 화면
  icon:
    logo: material/hard-hat

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/fit-tables.js

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 한글 제목도 #앵커가 되도록
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 홈: index.md
  - 함선:
      - ship/index.md
      - 돈·할당량·배송: ship/economy.md
  - 위성:
      - moons/index.md
      - 몬스터 스폰 규칙: moons/spawning.md
      - 시간대별 기대 스폰: moons/forecast.md
      - 행성별:
          - 41-익스페리멘테이션: moons/experimentation.md
          - 220-어슈어런스: moons/assurance.md
          - 56-보우: moons/vow.md
          - 21-오펜스: moons/offense.md
          - 61-마치: moons/march.md
          - 20-애더먼스: moons/adamance.md
          - 85-렌드: moons/rend.md
          - 7-다인: moons/dine.md
          - 8-타이탄: moons/titan.md
          - 68-아터피스: moons/artifice.md
          - 5-엠브리온: moons/embrion.md
          - 71-고르디온(회사): moons/company.md
  - 기상: weather/index.md
  - 폐기물: scrap/index.md
  - 생명체:
      - creatures/index.md
      - 감지·추격: creatures/detection.md
      - 소리와 눈 없는 개: creatures/noise.md
      - 체력·공격·상태: creatures/combat.md
