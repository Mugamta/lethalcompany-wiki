      - 몬스터별:
          - 실내:
              - 가면 쓴 사람: creatures/masked.md
              - 광대: creatures/jester.md
              - 늪지 점액괴어: creatures/gunkfish.md
              - 벙커 거미: creatures/bunker-spider.md
              - 브래컨: creatures/bracken.md
              - 비축 벌레: creatures/hoarding-bug.md
              - 시체 증식종: creatures/cadaver-growths.md
              - 식인 괴물: creatures/maneater.md
              - 썸퍼: creatures/thumper.md
              - 올가미 벼룩: creatures/snare-flea.md
              - 유령 소녀: creatures/ghost-girl.md
              - 이발사: creatures/barber.md
              - 집사: creatures/butler.md
              - 코일헤드: creatures/coil-head.md
              - 포자 도마뱀: creatures/spore-lizard.md
              - 하이그로디어: creatures/hygrodere.md
              - 호두까기 인형: creatures/nutcracker.md
          - 외부:
